<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snap Vanish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="36" height="36">
    <div class="title">
      <h1>Snap Vanish</h1>
      <p>Snap to turn to dust. Snap to come back.</p>
    </div>
    <label class="switch" title="Turn Snap Vanish on or off">
      <input type="checkbox" id="enabled" aria-label="Snap Vanish on/off">
      <span aria-hidden="true"></span>
    </label>
  </header>

  <section class="status" id="status" data-tone="idle" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <strong id="statusTitle">Checking…</strong>
      <p id="statusDetail"></p>
    </div>
  </section>

  <button id="snap" class="snap" type="button" disabled>
    <span aria-hidden="true">🫰</span> <span id="snapLabel">Snap now</span>
  </button>
  <p class="shortcut">Keyboard shortcut: <kbd id="shortcut">Alt+Shift+S</kbd> · <a href="#" id="changeShortcut">change</a></p>

  <section class="settings">
    <div class="field">
      <div class="label"><label for="sensitivity">Snap sensitivity</label><output id="sensitivityOut"></output></div>
      <input type="range" id="sensitivity" min="1" max="10" step="1">
      <div class="scale"><span>Strict</span><span>Easy</span></div>
    </div>

    <div class="field">
      <div class="label"><label for="duration">Dust duration</label><output id="durationOut"></output></div>
      <input type="range" id="duration" min="1.5" max="6" step="0.5">
      <div class="scale"><span>Quick</span><span>Dramatic</span></div>
    </div>

    <div class="field">
      <div class="label"><span id="directionLabel">Dust direction</span></div>
      <div class="seg" id="direction" role="radiogroup" aria-labelledby="directionLabel">
        <button type="button" role="radio" data-dir="left" title="Blow left">←</button>
        <button type="button" role="radio" data-dir="up" title="Drift up">↑</button>
        <button type="button" role="radio" data-dir="down" title="Fall down">↓</button>
        <button type="button" role="radio" data-dir="right" title="Blow right">→</button>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="muteMic"> Mute my mic while I'm vanished</label>
    <label class="check"><input type="checkbox" id="requireSound"> Confirm snaps with the click sound</label>
  </section>

  <footer>🔒 Runs entirely on this computer — no video or audio leaves your browser.</footer>

  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
